<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Terminal — Simulation</title>
<style>

:root[data-theme="dark"]{--bg:#0a0c0f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:11px/1.35 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;overflow:hidden}
.n,td.r,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.02em;color:#fff}
.sim{background:#3a2a05;color:var(--ac);border:1px solid #6b4d0a;padding:2px 8px;font-weight:600}
.sp{flex:1}
button,select,input{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:2px;font:inherit;padding:2px 7px;height:22px}
button{cursor:pointer}button:hover{background:#1f2630}button.on{background:#25344d;border-color:var(--blue);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:1px solid var(--blue)}
input{width:100%}
.clock{font-size:15px;color:#fff;min-width:68px;text-align:right}
.pill{padding:1px 7px;border:1px solid var(--bd);border-radius:2px}
.pill.Regular{color:var(--up);border-color:#1d5a3a}.pill.Closed{color:var(--dn)}.pill.Pre,.pill.After{color:var(--ac)}
.grid{flex:1;min-height:0;display:grid;gap:3px;padding:3px;grid-template-columns:272px 1fr 410px;grid-template-rows:236px 1fr 232px;grid-template-areas:"oe ch wl" "info ch news" "act act pf"}
.pn{background:var(--pn);border:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;min-width:0}
.hd{display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid var(--bd);background:var(--pn2);flex-wrap:wrap}
.hd b{font-weight:600;color:#fff;margin-right:4px}.hd .tag{color:var(--ac);font-size:10px}
.bd{padding:6px;overflow:auto;min-height:0;flex:1}

.up{color:var(--up)}.dn{color:var(--dn)}.cu{background:#12331f}.cd{background:#3a1517}

.sub{width:100%;height:26px;margin-top:6px;font-weight:600}.sub.B{background:#14532d;border-color:var(--up);color:#fff}.sub.S{background:#5a1a1d;border-color:var(--dn);color:#fff}

.sec{color:var(--ac);margin:6px 0 2px;font-size:10px}
#ch .bd{padding:0;position:relative;overflow:hidden}#cv{width:100%;height:100%;display:block;cursor:crosshair}
#ohlc{position:absolute;left:8px;top:4px;pointer-events:none;color:var(--tx);background:#0a0c0fcc;padding:1px 4px}

.tabs{display:flex;gap:1px}.tabs button{border:0;background:none;color:var(--dim);border-bottom:2px solid transparent;border-radius:0}.tabs button.on{color:#fff;border-bottom-color:var(--blue);background:none}
.x{color:var(--dim);cursor:pointer;padding:0 3px}.x:hover{color:var(--dn)}

@media (max-width:1000px){body{overflow:auto}#app{height:auto}.grid{display:flex;flex-direction:column}.pn{min-height:260px}#ch{min-height:380px}}

 <span class="sp"></span>

</div></div>
<div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),g=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*Math.random())};
const SY={AAPL:{n:'Apple',p:228,sh:15.2e9,eps:6.1,bv:4.2,avg:52e6,sv:1},MSFT:{n:'Microsoft',p:415,sh:7.43e9,eps:11.8,bv:13,avg:21e6,sv:.85},NVDA:{n:'NVIDIA',p:132,sh:24.4e9,eps:2.6,bv:2.1,avg:230e6,sv:1.6}};

const pad=n=>String(n).padStart(2,'0'),fT=t=>{const m=((Math.floor(t)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)},fD=t=>'D'+Math.floor(t/1440);
const sess=t=>{const m=((Math.floor(t)%1440)+1440)%1440;return m<240?'Closed':m<570?'Pre':m<960?'Regular':m<1200?'After':'Closed'};
const S={t:570,speed:1,paused:false,vm:1,mt:0,sel:'AAPL',side:'BUY',tab:'o',oid:1,orders:[],trades:[],log:[],news:[],eq:[],watch:['AAPL','MSFT','NVDA'],dr:{},ind:{sma:true,ema:false,bb:false,vwap:false},ac:{cash:100000,pos:{},real:0},mk:{},cd:{}};
function mv(o,mf,sc){const r=.55*mf+g()*.0005*o.sv*S.vm*sc+o.mom*.12+(o.anc-o.px)/o.anc*.0015+o.tr;o.mom=r;o.tr*=.985;o.anc*=1+g()*.00002;o.px=Math.max(1,o.px*(1+r));return r}
function initMk(){S.mk={};S.cd={};for(const s in SY){const p=SY[s].p,o={px:p*.97,mom:0,tr:0,anc:p,sv:SY[s].sv},a=[];for(let i=0;i<780;i++){const op=o.px;let h=op,l=op;for(let k=0;k<4;k++){mv(o,g()*.0004,1);h=Math.max(h,o.px);l=Math.min(l,o.px)}a.push({t:570-780+i,o:op,h,l,c:o.px,v:Math.round(SY[s].avg/1560*4*(.4+Math.random()*1.2))})}
 o.prev=o.open=o.hi=o.lo=o.px;o.h52=o.px*1.18;o.l52=o.px*.72;o.vol=0;o.bid=r2(o.px-.01);o.ask=r2(o.px+.01);o.oi=Math.round(150e3+Math.random()*200e3);S.mk[s]=o;S.cd[s]=a}
 S.t=570;S.ses=sess(S.t);S.dayEq=equity();S.eq=[equity()]}
function equity(){let e=S.ac.cash;for(const s in S.ac.pos)e+=S.ac.pos[s].q*S.mk[s].px;return e}
function note(m,c){S.log.unshift({t:S.t,m});S.log.length=Math.min(S.log.length,200);const d=document.createElement('div');d.className='toast '+(c||'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3800);save()}
const HL={up:['{s} rises following simulated demand update','{s} trades higher during simulated session','{s} sees increased simulated trading volume'],dn:['{s} slips after simulated guidance revision','{s} trades lower in simulated session'],x:['Technology sector moves {d} in simulated market','Simulated volatility {d} across large caps']};
function newsAdd(m){S.news.unshift({t:S.t,m});S.news.length=Math.min(S.news.length,40)}
function step(){S.t+=.25;const se=sess(S.t);if(se!==S.ses){if(se==='Regular')note('Market opened (simulated)','up');if(se==='After')note('Market closed (simulated)','am');S.ses=se}
 if(se==='Closed')return;const sc=se==='Regular'?1:.5,mf=g()*.0004*S.vm*sc+S.mt;S.mt*=.985;const mi=Math.floor(S.t);
 for(const s in S.mk){const o=S.mk[s],r=mv(o,mf,sc);o.hi=Math.max(o.hi,o.px);o.lo=Math.min(o.lo,o.px);o.h52=Math.max(o.h52,o.px);o.l52=Math.min(o.l52,o.px);
  const v=Math.round(SY[s].avg/1560*(.4+Math.random()*1.2)*(1+Math.abs(r)*3000)*(se==='Regular'?1:.25));o.vol+=v;
  const a=S.cd[s];let l=a[a.length-1];if(l.t<mi){l={t:mi,o:l.c,h:o.px,l:o.px,c:o.px,v:0};a.push(l);if(a.length>6000)a.shift()}l.h=Math.max(l.h,o.px);l.l=Math.min(l.l,o.px);l.c=o.px;l.v+=v;
  const sp=Math.max(.01,r2(o.px*.00006));o.bid=r2(o.px-sp/2);o.ask=r2(o.bid+sp);o.bs=100*(1+Math.floor(Math.random()*9));o.as=100*(1+Math.floor(Math.random()*9))}

 if(Math.random()<.012){const s=Object.keys(SY)[Math.floor(Math.random()*3)],o=S.mk[s],u=o.px>=o.prev;newsAdd((u?HL.up:HL.dn)[Math.floor(Math.random()*(u?3:2))].replace('{s}',s))}}
function match(){for(const od of S.orders){if(!['Pending','Accepted','Partial'].includes(od.st))continue;const o=S.mk[od.s];if(od.st==='Pending'){od.st='Accepted';continue}
 const st=od.type==='STP'||od.type==='STPLMT';if(st&&!od.trig){if(od.side==='BUY'?o.px>=od.stop:o.px<=od.stop){od.trig=1;note('Stop triggered: '+od.side+' '+od.s+' @ '+f2(od.stop),'am')}else continue}
 const e=od.type==='STP'?'MKT':od.type==='STPLMT'?'LMT':od.type;let px=null;if(e==='MKT')px=od.side==='BUY'?o.ask:o.bid;else if(od.side==='BUY'&&o.ask<=od.lim)px=o.ask;else if(od.side==='SELL'&&o.bid>=od.lim)px=o.bid;
 if(px!=null)fill(od,Math.min(od.q-od.f,100+Math.floor(Math.random()*250)),px)}}
function fill(od,q,px){const a=S.ac,c=r2(q*.005);let pl=null;
 if(od.side==='BUY'){if(a.cash<q*px+c){od.st='Rejected';note('Insufficient simulated buying power — '+od.s+' order rejected','dn');return}a.cash-=q*px+c;a.real-=c;const p=a.pos[od.s]||(a.pos[od.s]={q:0,avg:0});p.avg=(p.avg*p.q+px*q)/(p.q+q);p.q+=q}
 else{const p=a.pos[od.s];if(!p||p.q<q){od.st='Rejected';note('Insufficient position — '+od.s+' sell rejected','dn');return}a.cash+=q*px-c;pl=(px-p.avg)*q-c;a.real+=pl;od.pl=(od.pl||0)+pl;p.q-=q;if(!p.q)delete a.pos[od.s]}
 od.avg=(od.avg*od.f+px*q)/(od.f+q);od.f+=q;od.st=od.f>=od.q?'Filled':'Partial';S.trades.unshift({t:S.t,s:od.s,side:od.side,q,px,c,id:od.id,pl});
 note((od.st==='Filled'?'Filled ':'Partial fill ')+od.side+' '+q+' '+od.s+' @ '+f2(px)+(pl!=null?' · Profit '+sg(pl):''),pl!=null?(pl>=0?'up':'dn'):'up')}
function submit(){const s=S.sel,o=S.mk[s],q=Math.floor(+$('#oq').value),t=$('#ot').value,lim=+$('#ol').value,stp=+$('#os').value;
 if(!(q>0))return note('Enter a quantity above zero','dn');if((t==='LMT'||t==='STPLMT')&&!(lim>0))return note('Enter a limit price','dn');if((t==='STP'||t==='STPLMT')&&!(stp>0))return note('Enter a stop price','dn');
 const ref=t==='MKT'?o.ask:(t==='STP'?stp:lim||o.ask);
 if(S.side==='BUY'&&S.ac.cash<q*ref+q*.005)return note('Insufficient simulated buying power','dn');
 if(S.side==='SELL'){const held=(S.ac.pos[s]||{q:0}).q,res=S.orders.filter(x=>x.s===s&&x.side==='SELL'&&['Pending','Accepted','Partial'].includes(x.st)).reduce((a,x)=>a+x.q-x.f,0);if(q>held-res)return note('Cannot sell more than you hold (no shorting)','dn')}
 S.orders.unshift({id:S.oid++,t:S.t,s,side:S.side,type:t,q,f:0,avg:0,lim,stop:stp,tif:$('#otif').value,st:'Pending'});note('Order submitted: '+S.side+' '+q+' '+s+' '+t,'');save()}
const TN={MKT:'MKT',LMT:'LMT',STP:'STP',STPLMT:'STP LMT'};
function save(){try{localStorage.setItem('pt1',JSON.stringify({ac:S.ac,orders:S.orders,trades:S.trades,watch:S.watch,dr:S.dr,ind:S.ind,sel:S.sel,oid:S.oid,log:S.log.slice(0,50)}))}catch(e){}}

/* ---------- chart ---------- */
const cv=$('#cv'),cx=cv.getContext('2d'),V={vis:100,off:0,tf:1,type:'c',mx:null,my:null,dg:null,tool:'',pend:null},L={};
const TFS=[['1m',1],['5m',5],['15m',15],['30m',30],['1h',60],['4h',240],['1D',1440],['1W',10080]];
function bars(){const tf=V.tf,out=[];let c=null;for(const k of S.cd[S.sel]){const key=Math.floor(k.t/tf);if(!c||c.k!==key){c={k,o:k.o,h:k.h,l:k.l,c:k.c,v:k.v,t:k.t};out.push(c)}else{c.h=Math.max(c.h,k.h);c.l=Math.min(c.l,k.l);c.c=k.c;c.v+=k.v}}return out.map(b=>b)}

 const B=bars(),n=B.length,ax=54,pw=W-ax,ph=(H-18)*.78,vt=ph+4,vh=H-18-vt;V.off=Math.max(0,Math.min(V.off,n-5));const r=n-1-V.off,l=r-V.vis+1,bw=pw/V.vis,i0=Math.max(0,Math.floor(l)),i1=Math.min(n-1,r);
 let hi=-1e9,lo=1e9,vm=0;for(let i=i0;i<=i1;i++){hi=Math.max(hi,B[i].h);lo=Math.min(lo,B[i].l);vm=Math.max(vm,B[i].v)}const pd=(hi-lo)*.08||1;hi+=pd;lo-=pd;

 cx.font='10px IBM Plex Mono,monospace';cx.textBaseline='middle';cx.strokeStyle='#1a2029';cx.fillStyle='#6c7787';
 for(let j=0;j<=6;j++){const p=lo+(hi-lo)*j/6,yy=y(p);cx.beginPath();cx.moveTo(0,yy);cx.lineTo(pw,yy);cx.stroke();cx.fillText(f2(p),pw+4,yy)}
 cx.textBaseline='top';const step=Math.max(1,Math.round(90/bw));for(let i=Math.max(0,Math.ceil(l));i<=i1;i++)if(i%step===0){const xx=x(i);cx.beginPath();cx.moveTo(xx,0);cx.lineTo(xx,H-18);cx.stroke();const tt=B[i].k*V.tf;cx.fillText(V.tf>=1440?fD(tt):fT(tt),xx-12,H-14)}
 for(let i=i0;i<=i1;i++){const b=B[i],u=b.c>=b.o,col=u?'#2fbf71':'#e5484d',xx=x(i);cx.fillStyle=col+'88';const vv=b.v/vm*vh;cx.fillRect(xx-bw*.35,vt+vh-vv,Math.max(1,bw*.7),vv)}
